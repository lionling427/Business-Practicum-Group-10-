# EngagAI theme: forest green (brand, good news), butter yellow (warm
# backgrounds, highlights) and burgundy (risk, cost, bad news).

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseFontSize = 15
headingFontSizes = ["2.1rem", "1.5rem", "1.2rem", "1.05rem", "0.95rem", "0.85rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
metricValueFontWeight = 600
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false

[theme.light]
primaryColor = "#2F6B3F"
backgroundColor = "#FFFDF5"
secondaryBackgroundColor = "#FBF1CF"
textColor = "#1F2A22"
borderColor = "#E8DDB5"
linkColor = "#2F6B3F"
greenColor = "#2F6B3F"
redColor = "#8C2A3A"
orangeColor = "#B8901E"
blueColor = "#3B6E8F"
grayColor = "#6E6A5E"
dataframeHeaderBackgroundColor = "#1F4A2E"
dataframeHeaderTextColor = "#FFF8E1"
dataframeBorderColor = "#E8DDB5"
chartCategoricalColors = ["#2F6B3F", "#8C2A3A", "#C9A227", "#3B6E8F", "#9C6B4E"]

[theme.light.sidebar]
backgroundColor = "#1F4A2E"
secondaryBackgroundColor = "#2B5C3A"
textColor = "#FFF8E1"
borderColor = "#356B45"
primaryColor = "#F3D77A"
linkColor = "#F3D77A"
codeBackgroundColor = "#2B5C3A"

[theme.dark]
primaryColor = "#4E9A62"
backgroundColor = "#141A15"
secondaryBackgroundColor = "#1F2820"
textColor = "#F4EFDC"
borderColor = "#334034"
linkColor = "#F3D77A"
greenColor = "#4E9A62"
redColor = "#C2566A"
orangeColor = "#D9B44A"
blueColor = "#6A9CC0"
grayColor = "#A39E8E"
dataframeHeaderBackgroundColor = "#0F2416"
dataframeHeaderTextColor = "#FFF8E1"
dataframeBorderColor = "#334034"
chartCategoricalColors = ["#4E9A62", "#C2566A", "#D9B44A", "#6A9CC0", "#B88A6C"]

[theme.dark.sidebar]
backgroundColor = "#0F2416"
secondaryBackgroundColor = "#1F3A27"
textColor = "#FFF8E1"
borderColor = "#2B4A33"
primaryColor = "#F3D77A"
linkColor = "#F3D77A"
codeBackgroundColor = "#1F3A27"
